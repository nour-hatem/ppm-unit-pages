<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unit maintenance</title>
<style>
  :root {
    --bg: #EAF2FB; --card: #F7FAFE; --ink: #0B2545; --muted: #3D5A80; --line: #B8CDE6;
    --primary: #1F5FA8; --primary-ink: #EAF2FB; --soft: #D6E4F5; --soft-ink: #12335C;
    --alert: #0B2545; --alert-bg: #9DB8D9;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1F3A; --card: #102B4C; --ink: #D6E4F5; --muted: #9DB8D9; --line: #24456F;
      --primary: #4C8FD6; --primary-ink: #0B1F3A; --soft: #1B3A63; --soft-ink: #D6E4F5;
      --alert: #D6E4F5; --alert-bg: #1F3A63;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 32px; }
  .brand { margin: 0 0 14px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  dl { margin: 0 0 16px; display: grid; grid-template-columns: 110px 1fr; gap: 8px 10px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; word-break: break-word; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--soft-ink); font-weight: 700; }
  .chip.alert { background: var(--alert-bg); color: var(--alert); }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
  select { width: 100%; min-height: 48px; padding: 0 12px; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .btn { display: block; width: 100%; min-height: 52px; margin-top: 12px; padding: 14px 16px; text-align: center; text-decoration: none; font-size: 17px; font-weight: 700; border-radius: 12px; border: 2px solid var(--primary); }
  .btn.primary { background: var(--primary); color: var(--primary-ink); }
  .btn.secondary { background: transparent; color: var(--primary); }
  .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
  .error h1 { font-size: 20px; }
  /* Status section */
  #status-section { margin-top: 16px; }
  #status-section h2 { margin: 0 0 12px; font-size: 17px; font-weight: 700; color: var(--ink); }
  .status-row { display: flex; align-items: baseline; gap: 8px; margin: 6px 0; font-size: 15px; }
  .status-label { color: var(--muted); font-size: 13px; min-width: 90px; flex-shrink: 0; }
  .status-value { font-weight: 600; }
  .late-list { margin: 6px 0 0; padding-left: 16px; font-size: 14px; color: var(--muted); }
  .status-note { margin: 10px 0 0; font-size: 12px; color: var(--muted); text-align: right; }
  .status-unavailable { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="brand">Al-Fursan maintenance</p>
  <div id="app" class="card" aria-live="polite"><p class="sub">Loading</p></div>
</main>
<script src="data.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var T = {
    notFoundTitle: 'Unit not found',
    notFoundBody: 'Check that you scanned the label on the unit. If the problem continues, tell your supervisor.',
    noIdTitle: 'Scan a unit label',
    noIdBody: 'Open this page by scanning the QR label on a unit.',
    unit: 'Unit', type: 'Type', location: 'Location', model: 'Model', room: 'Room',
    thisMonth: 'This month', planned: 'Planned day', due: 'Checklists due',
    noPlan: 'No visit is planned for this month',
    visitLabel: 'Visit type',
    visitHint: 'Use the suggested type. Change it only if your supervisor tells you to.',
    start: 'Start scheduled maintenance',
    fault: 'Report a fault or repair',
    notConnected: 'The forms are not connected yet. Ask your supervisor.',
    verify: 'Check that the number on the unit label matches: '
  };
  var DATA = window.PPM_DATA, CFG = window.PPM_CONFIG;
  var app = document.getElementById('app');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Suggested visit type from the month rules, M is always due.
  function visitTypeFor(monthIndex) {
    var r = DATA.rules[monthIndex];
    if (r.Y) return 3;
    if (r.S) return 2;
    if (r.Q) return 1;
    return 0;
  }

  function plannedDay(id, now) {
    var list = (DATA.schedule[id] || []);
    var prefix = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-';
    for (var i = 0; i < list.length; i++) {
      if (list[i].indexOf(prefix) === 0) {
        var d = new Date(list[i] + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      }
    }
    return null;
  }

  function formUrl(formKey, id, visitIndex) {
    var f = CFG.forms[formKey];
    if (!f || !f.publishedUrl || !f.assetEntry) return null;
    var url = f.publishedUrl + (f.publishedUrl.indexOf('?') === -1 ? '?' : '&') + 'usp=pp_url&' +
      encodeURIComponent(f.assetEntry) + '=' + encodeURIComponent(id);
    if (visitIndex !== null && f.visitEntry) {
      url += '&' + encodeURIComponent(f.visitEntry) + '=' + encodeURIComponent(CFG.visitTypes[visitIndex]);
    }
    return url;
  }

  function showNotFound(noId) {
    app.className = 'card error';
    app.textContent = '';
    app.appendChild(el('h1', '', noId ? T.noIdTitle : T.notFoundTitle));
    app.appendChild(el('p', 'sub', noId ? T.noIdBody : T.notFoundBody));
  }

  /* ---------- Status section ---------- */

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function fmtDate(iso) {
    // iso is yyyy-MM-dd
    var parts = iso ? iso.split('-') : [];
    if (parts.length !== 3) return iso || '';
    var y = parts[0], m = parseInt(parts[1], 10), d = parts[2];
    return d + ' ' + (MONTHS[m - 1] || parts[1]) + ' ' + y;
  }

  function fmtMonth(key) {
    // key is yyyy-MM
    var parts = key ? key.split('-') : [];
    if (parts.length !== 2) return key || '';
    var m = parseInt(parts[1], 10);
    return (MONTHS[m - 1] || parts[1]) + ' ' + parts[0];
  }

  function safeStr(v) {
    if (typeof v !== 'string') return '';
    return v;
  }

  function validShape(d) {
    if (!d || typeof d !== 'object' || d.ok !== true) return false;
    if (typeof d.month !== 'string') return false;
    if (!d.maintenance || typeof d.maintenance !== 'object') return false;
    if (typeof d.maintenance.state !== 'string') return false;
    return true;
  }

  function renderStatus(container, d, select) {
    if (!validShape(d)) {
      container.appendChild(el('p', 'status-unavailable', 'The latest status is not available now. You can still start the visit.'));
      return;
    }

    var section = el('div', '');
    var h2 = el('h2', '', 'Unit status');
    section.appendChild(h2);

    var mnt = d.maintenance;
    var state = safeStr(mnt.state);
    var monthLabel = fmtMonth(safeStr(d.month));

    // This month row
    var thisMonthRow = el('div', 'status-row');
    thisMonthRow.appendChild(el('span', 'status-label', 'This month (' + monthLabel + ')'));

    var stateText = '';
    var alertChip = false;
    var visitThis = mnt.visitThisMonth;

    if (state === 'done') {
      if (mnt.overridden && (!visitThis)) {
        stateText = 'Maintenance Completed (marked by supervisor)';
      } else if (visitThis && safeStr(visitThis.date) && safeStr(visitThis.type)) {
        stateText = 'Maintenance Completed ' + fmtDate(safeStr(visitThis.date)) + ', ' + safeStr(visitThis.type);
      } else {
        stateText = 'Maintenance Completed';
      }
    } else if (state === 'not_done') {
      var planned = safeStr(mnt.planned);
      // Default state: unit has no maintenance record for the current period.
      // The status resets automatically at the start of each new period.
      stateText = 'Not Maintained' + (planned ? ', planned ' + fmtDate(planned) : '');
    } else if (state === 'overdue') {
      var planned2 = safeStr(mnt.planned);
      stateText = 'Overdue' + (planned2 ? ', planned day was ' + fmtDate(planned2) : '');
      alertChip = true;
    } else if (state === 'skipped') {
      stateText = 'Skipped by the supervisor';
    } else if (state === 'moved') {
      stateText = 'Moved by the supervisor';
    } else if (state === 'no_plan') {
      stateText = 'No visit is planned for this month';
    } else {
      stateText = safeStr(state);
    }

    var chip = el('span', alertChip ? 'chip alert' : 'chip', stateText);
    thisMonthRow.appendChild(chip);
    section.appendChild(thisMonthRow);

    // Update checklists-due chip and selector default from server, unless user already changed it
    if (typeof mnt.due === 'string' && mnt.due && select && !select._userChanged) {
      var dueLower = mnt.due.toLowerCase();
      var visitTypes = CFG.visitTypes || [];
      for (var vi = 0; vi < visitTypes.length; vi++) {
        if (visitTypes[vi].toLowerCase() === dueLower) {
          if (select.value !== String(vi)) {
            select.value = String(vi);
            select.dispatchEvent(new Event('change'));
          }
          // Update the chip in the dl
          var dueChip = document.querySelector('dd .chip');
          if (dueChip) dueChip.textContent = visitTypes[vi];
          break;
        }
      }
    }

    // Last visit row
    var lvRow = el('div', 'status-row');
    lvRow.appendChild(el('span', 'status-label', 'Last visit'));
    var lv = d.lastVisit;
    var lvText = (lv && safeStr(lv.date) && safeStr(lv.type))
      ? fmtDate(safeStr(lv.date)) + ', ' + safeStr(lv.type)
      : 'No visit recorded yet';
    lvRow.appendChild(el('span', 'status-value', lvText));
    section.appendChild(lvRow);

    // Late months
    if (Array.isArray(d.lateMonths) && d.lateMonths.length > 0) {
      var lmRow = el('div', 'status-row');
      lmRow.appendChild(el('span', 'status-label', 'Not completed'));
      var lmSpan = el('span', 'status-value', d.lateMonths.map(function (m) { return fmtMonth(safeStr(m)); }).join(', '));
      lmRow.appendChild(lmSpan);
      section.appendChild(lmRow);
    }

    // Fault/repair
    var faultRow = el('div', 'status-row');
    faultRow.appendChild(el('span', 'status-label', 'Repairs'));
    if (d.fault && safeStr(d.fault.date) && safeStr(d.fault.type)) {
      var isOpen = d.fault.open === true;
      var fChip = el('span', isOpen ? 'chip alert' : 'chip', isOpen ? 'Open issue' : 'Resolved');
      faultRow.appendChild(fChip);
      var fDetail = el('span', 'status-value', '');
      fDetail.textContent = ' ' + safeStr(d.fault.type) + ', ' + fmtDate(safeStr(d.fault.date)) + '. ' + safeStr(d.fault.status);
      faultRow.appendChild(fDetail);
    } else {
      faultRow.appendChild(el('span', 'status-value', 'No fault reports'));
    }
    section.appendChild(faultRow);

    // Checked at
    if (typeof d.generatedAt === 'string') {
      try {
        var genDate = new Date(d.generatedAt);
        var hh = String(genDate.getHours()).padStart(2, '0');
        var mm = String(genDate.getMinutes()).padStart(2, '0');
        var noteP = el('p', 'status-note', 'Checked at ' + hh + ':' + mm);
        section.appendChild(noteP);
      } catch (e) { /* ignore */ }
    }

    container.appendChild(section);
  }

  function loadStatus(id, container, select) {
    var statusUrl = CFG.statusUrl;
    if (!statusUrl) return; // no status configured, section hidden

    var cbName = 'ppmStatus' + Date.now();
    var timer = null;
    var script = null;

    function cleanup() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (script && script.parentNode) script.parentNode.removeChild(script);
      script = null;
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
    }

    function onResult(d) {
      cleanup();
      container.textContent = '';
      renderStatus(container, d, select);
    }

    function onFail() {
      cleanup();
      container.textContent = '';
      container.appendChild(el('p', 'status-unavailable', 'The latest status is not available now. You can still start the visit.'));
    }

    window[cbName] = function (d) { onResult(d); };

    var timeout = (typeof CFG.statusTimeoutMs === 'number' && CFG.statusTimeoutMs > 0)
      ? CFG.statusTimeoutMs : 12000;
    timer = setTimeout(onFail, timeout);

    script = document.createElement('script');
    script.src = statusUrl + '?id=' + encodeURIComponent(id) + '&callback=' + encodeURIComponent(cbName);
    script.onerror = onFail;
    document.head.appendChild(script);
  }

  function render() {
    var id = (new URLSearchParams(window.location.search).get('id') || '').trim();
    if (!id) { showNotFound(true); return; }
    var asset = Object.prototype.hasOwnProperty.call(DATA.assets, id) ? DATA.assets[id] : null;
    if (!asset) { showNotFound(false); return; }

    var now = new Date();
    var suggested = visitTypeFor(now.getMonth());
    var formKey = asset.type === 'Package Unit' ? 'package' : 'split';

    app.textContent = '';
    app.appendChild(el('h1', '', asset.name));
    app.appendChild(el('p', 'sub', T.verify + id));

    var dl = el('dl');
    function row(k, v) { if (!v) return; dl.appendChild(el('dt', '', k)); dl.appendChild(el('dd', '', v)); }
    row(T.type, asset.type);
    row(T.model, asset.model);
    row(T.location, asset.loc);
    row(T.room, asset.room);
    var day = plannedDay(id, now);
    row(T.planned, day || T.noPlan);
    dl.appendChild(el('dt', '', T.due));
    var dd = el('dd'); dd.appendChild(el('span', 'chip', CFG.visitTypes[suggested])); dl.appendChild(dd);
    app.appendChild(dl);

    var label = el('label', '', T.visitLabel); label.setAttribute('for', 'visit');
    var select = el('select'); select.id = 'visit';
    select._userChanged = false;
    CFG.visitTypes.forEach(function (v, i) {
      var o = el('option', '', v); o.value = String(i); if (i === suggested) o.selected = true; select.appendChild(o);
    });
    select.addEventListener('change', function () { select._userChanged = true; update(); });
    app.appendChild(label); app.appendChild(select);
    app.appendChild(el('p', 'hint', T.visitHint));

    var start = el('a', 'btn primary', T.start); start.id = 'start';
    var fault = el('a', 'btn secondary', T.fault); fault.id = 'fault';
    function update() {
      var u = formUrl(formKey, id, parseInt(select.value, 10));
      if (u) { start.href = u; start.removeAttribute('aria-disabled'); }
      else { start.removeAttribute('href'); start.setAttribute('aria-disabled', 'true'); }
    }
    update();
    var fu = formUrl('corrective', id, null);
    if (fu) fault.href = fu; else { fault.removeAttribute('href'); fault.setAttribute('aria-disabled', 'true'); }
    app.appendChild(start); app.appendChild(fault);
    if (!formUrl(formKey, id, 0)) app.appendChild(el('p', 'note', T.notConnected));
    document.title = asset.name;

    // Status section
    if (CFG.statusUrl) {
      var statusSection = el('div', 'card', '');
      statusSection.id = 'status-section';
      statusSection.appendChild(el('p', 'sub', 'Loading status...'));
      var mainEl = document.querySelector('main');
      mainEl.appendChild(statusSection);
      loadStatus(id, statusSection, select);
    }
  }
  render();
})();
</script>
</body>
</html>
